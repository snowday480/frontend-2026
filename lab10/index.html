<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота № 10 — Однорукий бандит</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">

        <div class="control-panel">
            <div class="panel-card">
                <label for="balance-input" class="panel-label">Баланс ($)</label>
                <input type="number" id="balance-input" class="panel-input" value="1000" min="1" step="10">
            </div>
            <div class="panel-card">
                <label for="bet-input" class="panel-label">Ставка на крутку ($)</label>
                <input type="number" id="bet-input" class="panel-input" value="50" min="1" step="10">
            </div>
        </div>

        <div class="slot-wrapper">
            <div class="slot-machine">
                <div class="reel" id="reel-1">
                    <div class="reel-strip" id="strip-1"></div>
                    <div class="reel-shadow"></div>
                </div>
                <div class="reel" id="reel-2">
                    <div class="reel-strip" id="strip-2"></div>
                    <div class="reel-shadow"></div>
                </div>
                <div class="reel" id="reel-3">
                    <div class="reel-strip" id="strip-3"></div>
                    <div class="reel-shadow"></div>
                </div>
            </div>
            <div class="lever-track" id="lever-track" title="Потягніть важіль вниз!">
                <div class="lever-knob" id="lever-knob"></div>
            </div>
        </div>

        <div class="status-box" id="game-status">Потягніть важіль вниз!</div>

        <div class="game-over-box" id="game-over-box" style="display: none;">
            <div class="game-over-title">ПРОГРАНО</div>
            <button id="reset-balance-btn" class="btn-reset-balance">Поповнити баланс</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
